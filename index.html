<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher | Verified Dumps</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #050508;
            --surface: #0f0f14;
            --surface-hover: #181820;
            --border: #252532;
            --text: #e4e4e7;
            --muted: #71717a;
            --accent: #22d3ee;
            --accent-glow: rgba(34, 211, 238, 0.3);
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --gold: #fbbf24;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Noise overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 9999;
        }

        /* Header */
        header {
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #818cf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .nav-links a:hover { color: var(--text); }

        .admin-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .admin-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .admin-badge {
            display: none;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .admin-badge.active { display: flex; }

        /* Main */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Contact Card */
        .contact-alert {
            background: linear-gradient(90deg, rgba(34, 211, 238, 0.1), transparent);
            border-left: 3px solid var(--accent);
            padding: 1.25rem 1.5rem;
            border-radius: 0 12px 12px 0;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .contact-alert h3 {
            color: var(--accent);
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .contact-alert p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .ig-pill {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.75rem 1.25rem;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .ig-pill button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 0.35rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
        }

        /* Stats */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gold);
            font-family: 'JetBrains Mono', monospace;
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .search input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.875rem 1rem 0.875rem 2.5rem;
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .search input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.1);
        }

        .search::before {
            content: '⌕';
            position: absolute;
            left: 0.875rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.25rem;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
        }

        .filter-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 0.875rem 1.25rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--surface-hover);
            color: var(--text);
            border-color: var(--accent);
        }

        /* Admin Panel */
        .admin-panel {
            display: none;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(217, 119, 6, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .admin-panel.active { display: block; }

        .admin-title {
            color: #fbbf24;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .field label {
            display: block;
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .field input, .field select {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.625rem;
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
        }

        .field input:focus, .field select:focus {
            outline: none;
            border-color: #fbbf24;
        }

        .admin-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #818cf8);
            color: #000;
        }

        .btn-warning {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(34, 211, 238, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .balance {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
        }

        .tags {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            align-items: flex-end;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
        }

        .tag-bank { background: rgba(34, 211, 238, 0.1); color: var(--accent); }
        .tag-sec-high { background: rgba(74, 222, 128, 0.1); color: var(--success); }
        .tag-sec-med { background: rgba(251, 191, 36, 0.1); color: var(--warning); }
        .tag-sec-low { background: rgba(248, 113, 113, 0.1); color: var(--danger); }

        .details {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .detail {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .detail-icon {
            width: 28px;
            height: 28px;
            background: var(--surface-hover);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .price {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
        }

        .price-note {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-buy {
            background: var(--accent);
            color: #000;
            font-weight: 700;
        }

        .btn-copy {
            background: var(--surface-hover);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-edit, .btn-delete {
            display: none;
            grid-column: span 1;
        }

        body.admin .btn-edit, body.admin .btn-delete {
            display: block;
        }

        body.admin .card-actions {
            grid-template-columns: 1fr 1fr 1fr 1fr;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: slideIn 0.3s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 2rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }

        .modal h3 {
            margin-bottom: 0.5rem;
        }

        .modal p {
            color: var(--muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .code-input {
            width: 100%;
            background: var(--bg);
            border: 2px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .code-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
            .nav-links { display: none; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon">◈</div>
                <span>CIPHER</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" onclick="filterItems('all')">Market</a></li>
                <li><a href="#" onclick="showToast('Verified vendor since 2022')">Verified</a></li>
                <li><a href="#" onclick="showToast('Escrow: Contact v2bo.xx')">Escrow</a></li>
            </ul>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="admin-badge" id="adminBadge">
                    👑 ADMIN
                </div>
                <button class="admin-toggle" onclick="openAdminModal()">
                    🔐 Unlock
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="contact-alert">
            <div>
                <h3>📩 Secure Contact</h3>
                <p>Copy card info and message <strong>v2bo.xx</strong> on Instagram to complete purchase</p>
            </div>
            <div class="ig-pill">
                <span>@v2bo.xx</span>
                <button onclick="copyText('v2bo.xx')">Copy</button>
            </div>
        </div>

        <div class="stats-row">
            <div class="stat">
                <div class="stat-value" id="statCount">...</div>
                <div class="stat-label">In Stock</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statAvg">...</div>
                <div class="stat-label">Avg Price</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="statRange">...</div>
                <div class="stat-label">Price Range</div>
            </div>
            <div class="stat">
                <div class="stat-value">98%</div>
                <div class="stat-label">Valid</div>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <div class="admin-title">👑 Admin Control</div>
            <div class="admin-grid">
                <div class="field">
                    <label>Bank</label>
                    <input type="text" id="aBank" placeholder="Chase">
                </div>
                <div class="field">
                    <label>Type</label>
                    <select id="aType">
                        <option>VISA</option>
                        <option>MASTERCARD</option>
                        <option>AMEX</option>
                        <option>DISCOVER</option>
                    </select>
                </div>
                <div class="field">
                    <label>Balance ($)</label>
                    <input type="number" id="aBalance" placeholder="5000">
                </div>
                <div class="field">
                    <label>Price ($)</label>
                    <input type="number" id="aPrice" placeholder="Auto">
                </div>
                <div class="field">
                    <label>Location</label>
                    <input type="text" id="aLoc" placeholder="CA|90210">
                </div>
                <div class="field">
                    <label>Security</label>
                    <select id="aSec">
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>
            <div class="admin-actions">
                <button class="btn btn-primary" onclick="addItem()">Add Item</button>
                <button class="btn btn-warning" onclick="genRandom()">+10 Random</button>
                <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
            </div>
        </div>

        <div class="controls">
            <div class="search">
                <input type="text" id="search" placeholder="Search bank, type, location..." onkeyup="search()">
            </div>
            <div class="filters">
                <button class="filter-btn active" onclick="filterItems('all')">All</button>
                <button class="filter-btn" onclick="filterItems('VISA')">VISA</button>
                <button class="filter-btn" onclick="filterItems('MASTERCARD')">MC</button>
                <button class="filter-btn" onclick="filterItems('AMEX')">Amex</button>
                <button class="filter-btn" onclick="sortBy('price')">Price ↓</button>
            </div>
        </div>

        <div class="grid" id="grid">
            <div class="card skeleton" style="height: 280px;"></div>
            <div class="card skeleton" style="height: 280px;"></div>
            <div class="card skeleton" style="height: 280px;"></div>
        </div>
    </main>

    <div class="modal-overlay" id="adminModal">
        <div class="modal">
            <h3>🔐 Admin Access</h3>
            <p>Enter access code to unlock admin panel</p>
            <input type="text" class="code-input" id="codeInput" maxlength="10" placeholder="CODE">
            <button class="btn btn-primary" onclick="checkCode()" style="width: 100%;">Unlock</button>
        </div>
    </div>

    <script>
        let items = [];
        let isAdmin = false;
        const API = 'http://localhost:3000/api';

        async function load() {
            const res = await fetch(`${API}/items`);
            items = await res.json();
            render();
            updateStats();
        }

        function render() {
            const grid = document.getElementById('grid');
            const filtered = getFiltered();
            
            grid.innerHTML = filtered.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div class="balance">$${item.balance.toLocaleString()}</div>
                        <div class="tags">
                            <span class="tag tag-bank">${item.bank}</span>
                            <span class="tag tag-sec-${item.security}">${item.security}</span>
                        </div>
                    </div>
                    <div class="details">
                        <div class="detail">
                            <span class="detail-icon">💳</span>
                            <span>${item.type}</span>
                        </div>
                        <div class="detail">
                            <span class="detail-icon">📍</span>
                            <span>${item.location}</span>
                        </div>
                        <div class="detail">
                            <span class="detail-icon">✓</span>
                            <span>Verified Live</span>
                        </div>
                    </div>
                    <div class="price-row">
                        <span class="price">$${item.price}</span>
                        <span class="price-note">${((item.price/item.balance)*100).toFixed(1)}% of balance</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-buy" onclick="buy('${item.id}')">Buy</button>
                        <button class="btn btn-copy" onclick="copy('${item.id}')">Copy</button>
                        ${isAdmin ? `
                        <button class="btn btn-edit" onclick="edit('${item.id}')">Edit</button>
                        <button class="btn btn-delete" onclick="del('${item.id}')">Del</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function getFiltered() {
            let f = items;
            const filter = window.currentFilter || 'all';
            if (filter !== 'all') f = f.filter(i => i.type === filter);
            
            const q = document.getElementById('search')?.value.toLowerCase() || '';
            if (q) f = f.filter(i => 
                i.bank.toLowerCase().includes(q) || 
                i.location.toLowerCase().includes(q)
            );
            return f;
        }

        function updateStats() {
            document.getElementById('statCount').textContent = items.length;
            const prices = items.map(i => i.price);
            const avg = Math.floor(prices.reduce((a,b) => a+b, 0) / prices.length);
            document.getElementById('statAvg').textContent = '$' + avg;
            document.getElementById('statRange').textContent = '$' + Math.min(...prices) + '-$' + Math.max(...prices);
        }

        async function addItem() {
            const balance = parseInt(document.getElementById('aBalance').value) || 5000;
            const price = parseInt(document.getElementById('aPrice').value) || Math.min(Math.floor(balance * 0.015), 100);
            
            const item = {
                bank: document.getElementById('aBank').value || 'Unknown',
                type: document.getElementById('aType').value,
                balance: balance,
                price: price,
                location: document.getElementById('aLoc').value || 'XX|00000',
                security: document.getElementById('aSec').value
            };
            
            await fetch(`${API}/items`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(item)
            });
            
            load();
            showToast('Item added');
        }

        async function genRandom() {
            await fetch(`${API}/reset`, {method: 'POST'});
            load();
            showToast('Generated 150 new items');
        }

        async function resetAll() {
            if (!confirm('Delete everything?')) return;
            await fetch(`${API}/reset`, {method: 'POST'});
            load();
        }

        async function edit(id) {
            const item = items.find(i => i.id === id);
            const newPrice = prompt('New price:', item.price);
            if (newPrice) {
                await fetch(`${API}/items/${id}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({price: parseInt(newPrice)})
                });
                load();
            }
        }

        async function del(id) {
            await fetch(`${API}/items/${id}`, {method: 'DELETE'});
            load();
        }

        function buy(id) {
            const item = items.find(i => i.id === id);
            copyText(`Bank: ${item.bank}\nType: ${item.type}\nBalance: $${item.balance.toLocaleString()}\nPrice: $${item.price}\nLocation: ${item.location}\n\nContact @v2bo.xx on IG to purchase`, 'Copied! Contact v2bo.xx to complete');
        }

        function copy(id) { buy(id); }

        function filterItems(t) {
            window.currentFilter = t;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function sortBy() {
            items.sort((a,b) => a.price - b.price);
            render();
        }

        function search() { render(); }

        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
            document.getElementById('codeInput').focus();
        }

        function checkCode() {
            const code = document.getElementById('codeInput').value;
            if (code === 'GAY') {
                isAdmin = true;
                document.body.classList.add('admin');
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('adminBadge').classList.add('active');
                document.getElementById('adminModal').classList.remove('active');
                render();
                showToast('Admin mode active');
            } else {
                showToast('Invalid code');
            }
        }

        function copyText(text, msg) {
            navigator.clipboard.writeText(text);
            showToast(msg || 'Copied!');
        }

        function showToast(m) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<span style="color: var(--success);">✓</span> ${m}`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        document.getElementById('adminModal').addEventListener('click', e => {
            if (e.target === document.getElementById('adminModal')) {
                document.getElementById('adminModal').classList.remove('active');
            }
        });

        load();
    </script>
</body>
</html>
