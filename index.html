<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Private Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d12;
            --bg-secondary: #16161f;
            --bg-card: #1e1e2a;
            --bg-card-hover: #272736;
            --border-color: #2d2d3d;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9a;
            --accent-gold: #ffd700;
            --accent-red: #ff4757;
            --accent-green: #2ed573;
            --accent-blue: #5352ed;
            --accent-purple: #a55eea;
            --accent-orange: #ff6b35;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-gold: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-admin: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            background: rgba(22, 22, 31, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1.2rem 0;
        }

        .nav-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--text-primary);
        }

        .discount-btn {
            background: var(--gradient-gold);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .discount-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(240, 147, 251, 0.4);
        }

        /* Contact Banner */
        .contact-banner {
            background: linear-gradient(90deg, rgba(83, 82, 237, 0.1) 0%, rgba(165, 94, 234, 0.05) 100%);
            border-left: 4px solid var(--accent-purple);
            margin: 2rem auto;
            max-width: 1600px;
            padding: 1.5rem 2rem;
            border-radius: 0 12px 12px 0;
        }

        .contact-banner h3 {
            color: var(--accent-purple);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-banner p {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .contact-handle {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-card);
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            border: 1px solid var(--border-color);
            color: var(--accent-gold);
            font-weight: 600;
        }

        .copy-btn {
            background: var(--accent-purple);
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #7c3aed;
            transform: translateY(-1px);
        }

        /* Stats Bar */
        .stats-bar {
            max-width: 1600px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* Filters */
        .filters {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-purple);
            color: white;
            border-color: var(--accent-purple);
        }

        /* Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
